<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waterdrop — find duplicate photos &amp; videos</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Inline SVG icon sprite (referenced via <use href="#i-name">) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M4 7h16"/>
        <path d="M18 7v12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V7"/>
        <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
        <path d="M10 11v6M14 11v6"/>
      </symbol>
      <symbol id="i-both" viewBox="0 0 24 24">
        <path d="M12 3 3 7.5 12 12l9-4.5L12 3Zm9 9-9 4.5L3 12m18 4.5-9 4.5-9-4.5"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
      <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="m21 15-5-5L5 21"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="brand">
      <!-- Custom logo: two overlapping water drops (a hint at "duplicates") -->
      <svg class="logo" viewBox="0 0 40 40" width="40" height="40" aria-hidden="true">
        <defs>
          <linearGradient id="dropA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7fe0f5"/>
            <stop offset="1" stop-color="#13a7da"/>
          </linearGradient>
          <linearGradient id="dropB" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#36c4ef"/>
            <stop offset="1" stop-color="#0a6f9c"/>
          </linearGradient>
        </defs>
        <path d="M26 8s7.5 9 7.5 14.4A7.5 7.5 0 0 1 26 30a7.5 7.5 0 0 1-7.5-7.6C18.5 17 26 8 26 8Z"
              fill="url(#dropA)" opacity=".55"/>
        <path d="M15 6s8.5 10.2 8.5 16.4A8.5 8.5 0 0 1 15 31a8.5 8.5 0 0 1-8.5-8.6C6.5 16.2 15 6 15 6Z"
              fill="url(#dropB)"/>
        <ellipse cx="11.6" cy="22" rx="2.4" ry="3.4" fill="#fff" opacity=".4"/>
      </svg>
      <div>
        <h1>Waterdrop</h1>
        <p class="tagline">find duplicate photos &amp; videos between two folders</p>
      </div>
    </div>
  </header>

  <main>
    <!-- Setup panel -->
    <section class="panel" id="setup">
      <div class="folder-row">
        <label>Folder 1</label>
        <input type="text" id="folderA" placeholder="Choose the first folder…" readonly>
        <button class="btn ghost" data-pick="folderA">
          <svg class="icon"><use href="#i-folder"></use></svg> Browse
        </button>
      </div>
      <div class="folder-row">
        <label>Folder 2</label>
        <input type="text" id="folderB" placeholder="Choose the second folder…" readonly>
        <button class="btn ghost" data-pick="folderB">
          <svg class="icon"><use href="#i-folder"></use></svg> Browse
        </button>
      </div>

      <div class="options">
        <div class="opt">
          <label for="imageThreshold">Image similarity
            <span class="hint">lower = stricter</span>
          </label>
          <input type="range" id="imageThreshold" min="0" max="40" value="12">
          <output id="imageThresholdOut">12</output>
        </div>
        <div class="opt">
          <label for="videoTolerance">Video tolerance
            <span class="hint">lower = stricter</span>
          </label>
          <input type="range" id="videoTolerance" min="0" max="20" value="10">
          <output id="videoToleranceOut">10</output>
        </div>
        <div class="opt switch-opt">
          <label class="switch">
            <input type="checkbox" id="permanent">
            <span class="track"><span class="thumb"></span></span>
          </label>
          <span class="switch-label">Delete permanently <span class="hint">(off = move to Trash)</span></span>
        </div>
      </div>

      <div class="actions">
        <button class="btn primary" id="startScan" disabled>
          <svg class="icon"><use href="#i-search"></use></svg> Start scan
        </button>
        <span class="dep-warning" id="depWarning" hidden></span>
      </div>
    </section>

    <!-- Progress -->
    <section class="panel progress" id="progress" hidden>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <p id="progressLabel">Starting…</p>
    </section>

    <!-- Results -->
    <section id="results" hidden>
      <div class="summary" id="summary">
        <span id="summaryText"></span>
        <nav class="tabs" id="tabs"></nav>
      </div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="emptyState" hidden>No duplicates in this category.</p>
    </section>
  </main>

  <!-- Lightbox overlay for full preview / video playback -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">
      <svg class="icon"><use href="#i-close"></use></svg>
    </button>
    <div class="lightbox-content" id="lightboxContent"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
