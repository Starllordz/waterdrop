name: Build standalone

# Builds self-contained Waterdrop executables (interpreter + ffmpeg/ffprobe +
# czkawka_cli bundled, nothing for the user to install). Runs on demand and on
# version tags; the per-OS apps are uploaded as workflow artifacts.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Fetch bundled tools (ffmpeg, ffprobe, czkawka_cli)
        run: python scripts/fetch_tools.py

      - name: Build standalone app
        run: pyinstaller waterdrop.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waterdrop-${{ matrix.label }}
          path: dist/Waterdrop
          if-no-files-found: error
