name: Build standalone

# Builds self-contained Waterdrop apps (interpreter + ffmpeg/ffprobe +
# czkawka_cli bundled, nothing for the user to install) for each OS, and
# attaches the zips to a GitHub Release when a version tag is pushed.
#
# Versioning: the package version comes from the git tag. Push `vX.Y.Z` to cut a
# release; the tag's number is stamped into version.py (so the app reports it),
# used in the zip file names, and shown on the Release. Pull requests and manual
# runs build a `0.0.0-dev.<sha>` package (artifacts only, no release) so the full
# packaging is validated before a tag is cut.
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stamp version into the build
        shell: bash
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          printf '"""Single source of truth for Waterdrop'\''s version."""\n\n__version__ = "%s"\n' "$V" > version.py
          echo "Building version $V"

      - name: Install build dependencies
        run: pip install pyinstaller -r requirements.txt

      - name: Fetch bundled tools (ffmpeg, ffprobe, czkawka_cli)
        run: python scripts/fetch_tools.py

      - name: Build standalone app
        run: pyinstaller waterdrop.spec

      - name: Package zip
        shell: bash
        env:
          NAME: Waterdrop-${{ matrix.label }}-${{ steps.version.outputs.version }}
        run: python -c "import shutil, os; shutil.make_archive(os.environ['NAME'], 'zip', 'dist', 'Waterdrop')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waterdrop-${{ matrix.label }}-${{ steps.version.outputs.version }}
          path: Waterdrop-${{ matrix.label }}-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
